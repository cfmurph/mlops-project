name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -c https://raw.githubusercontent.com/apache/airflow/constraints-3.4.0/constraints-3.12.txt
      - run: pytest -v

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images to GitHub Container Registry
        run: |
          REPO=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t $REPO/api:${{ github.sha }} -t $REPO/api:latest .
          docker build -f Dockerfile.airflow -t $REPO/airflow:${{ github.sha }} -t $REPO/airflow:latest .
          docker push --all-tags $REPO/api
          docker push --all-tags $REPO/airflow
