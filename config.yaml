# What the pipelines cover. Most extensions are a change here; see README "How to extend".

# CREA MLS® HPI sheet name: display name. Add a line to cover another region.
regions:
  AGGREGATE: Canada
  BRITISH_COLUMBIA: British Columbia
  GREATER_VANCOUVER: Greater Vancouver
  FRASER_VALLEY: Fraser Valley
  LOWER_MAINLAND: Lower Mainland
  VICTORIA: Victoria
  VANCOUVER_ISLAND: Vancouver Island
  INTERIOR_BC: Interior BC
  CHILLIWACK_AND_DISTRICT: Chilliwack and District
  ALBERTA: Alberta
  CALGARY: Calgary
  EDMONTON: Edmonton

# One entry per thing to forecast. Each gets its own forecast_<name> and monitor_<name> DAG.
forecasts:
  home_price:
    target: crea_hpi.price            # <source>.<column> to forecast
    sources: [crea_hpi, boc_rates]    # every numeric column of these becomes a feature
    horizon_months: 3
    holdout_months: 24
    train_start: "2012-01-01"         # earlier boom/bust years hurt forecasts of today's market
    candidates: [gradient_boosting, damped_momentum]
    monitor:
      max_error_ratio: 1.5            # alert if live error > 1.5 × the model's holdout error
