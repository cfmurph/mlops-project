# Airflow 3.4.0 for local development, trimmed from the official docker-compose.yaml:
# LocalExecutor instead of Celery (no redis/worker/flower), no triggerer, no example DAGs,
# plus the forecast API and the project datastore.
# Not for production. Start: docker compose up -d   UI: http://localhost:8080 (airflow / airflow)
#
# Datastore: local by default (SeaweedFS S3 + mlflow-db Postgres). For cloud (R2 + Neon):
#   cp .env.cloud.example .env.cloud  # fill in
#   docker compose --env-file .env.cloud up -d
x-datastore-env:
  &datastore-env
  DATA_URI: ${DATA_URI:-s3://housing}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-housing}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-housing-secret}
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://seaweedfs:8333}
  MLFLOW_S3_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://seaweedfs:8333}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-postgresql+psycopg://mlflow:mlflow@mlflow-db/mlflow}

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: housing-airflow:3.4.0
  environment:
    &airflow-common-env
    <<: *datastore-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    PYTHONPATH: /opt/airflow  # so DAGs can import the housing package
    MLFLOW_DISABLE_AGENT_HINT: '1'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./housing:/opt/airflow/housing
    - ./config.yaml:/opt/airflow/config.yaml:ro
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy
    mlflow-db:
      condition: service_healthy

services:
  # Project datastore (local). S3-compatible object storage for all project files.
  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    environment:
      AWS_ACCESS_KEY_ID: housing
      AWS_SECRET_ACCESS_KEY: housing-secret
      S3_BUCKET: housing  # created on startup if missing
    ports:
      - "8333:8333"  # S3 API, for DuckDB / local scripts
    volumes:
      - seaweedfs-volume:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 10s
      retries: 10
      start_period: 10s
    restart: always

  # Project datastore (local). MLflow runs and model registry.
  mlflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5433:5432"
    volumes:
      - mlflow-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always


  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,config}
        /entrypoint airflow config list >/dev/null
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,config}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      <<: *datastore-env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: always

volumes:
  postgres-db-volume:
  seaweedfs-volume:
  mlflow-db-volume:
